name: Distribute verified demo
on:
  push:
    branches: [main]
    paths: ['.github/workflows/distribute-demo.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: distribute-demo-0.6.0
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN: '43535391773'
      SOURCE_SHA: 'f7ab16ba56fb6d81689a782266046bc4409c90e6'
      APK_SHA256: 'a2abf280913f17d67df13d0391fde93299b4eb295934bc11c07fca8fc7fffd0b'
      RELEASE_TAG: 'v0.6.0-demo'
      APK_NAME: 'GRBL-Tool-Mobile-0.6.0.apk'
    steps:
      - name: Verify source workflow succeeded at the audited commit
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" > source-run.json
          jq -e --arg sha "$SOURCE_SHA" '.head_sha == $sha and .status == "completed" and .conclusion == "success"' source-run.json
          # The release tag points to this publishing revision. Its app code must match the audited source.
          gh api "repos/$GH_REPO/compare/$SOURCE_SHA...$GITHUB_SHA" > release-diff.json
          jq -e 'all(.files[]; (.filename | startswith("docs/")) or .filename == "README.md" or .filename == ".github/workflows/distribute-demo.yml")' release-diff.json
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
          path: package
      - name: Verify and prepare original signed APK
        shell: bash
        run: |
          set -euo pipefail
          cd package
          sha256sum --check SHA256SUMS.txt
          test "$(find . -maxdepth 1 -name '*-Signed.apk' | wc -l)" -eq 1
          mv ./*-Signed.apk "$APK_NAME"
          printf '%s  %s\n' "$APK_SHA256" "$APK_NAME" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Publish immutable demo assets
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            mkdir existing
            gh release download "$RELEASE_TAG" --pattern "$APK_NAME" --dir existing
            printf '%s  %s\n' "$APK_SHA256" "existing/$APK_NAME" | sha256sum --check
            exit 0
          fi
          cat > release-notes.md <<'NOTES'
          已通过 105 项核心测试及 Android API 35 模拟器完整交互验收的 0.6.0 演示版。

          安装：Android 10 及以上，ARM64 / x86_64。下载 APK 后安装，在设备页点击“体验完整演示”。

          加工参数和图像调整各自集中一页。直接接入桌面 LaserGRBL CsPotrace、八套 Cyotek 抖动，以及灰度/阈值/白区优化。轮廓预览默认隐藏关光空移，可打开虚线查看。保留毫米/像素上限与等比例缩小。
          保留 USB 控制、文件导入与预览、暂停/继续、后台完成、任务历史和内置演示。
          实体控制板与现场加工验收独立进行。

          原始已验收安装包，保留其签名与 SHA256；源码版本为 f7ab16ba56fb6d81689a782266046bc4409c90e6。
          源码采用 GPL-3.0-or-later；源码和第三方声明包含在本标签对应的仓库中。
          NOTES
          gh release create "$RELEASE_TAG" "package/$APK_NAME" package/SHA256SUMS.txt --target "$GITHUB_SHA" --prerelease --title 'GRBL Tool Mobile 0.6.0 Demo' --notes-file release-notes.md
