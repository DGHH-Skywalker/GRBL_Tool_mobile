name: Distribute verified demo
on:
  push:
    branches: [main]
    paths: ['.github/workflows/distribute-demo.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: distribute-demo-0.7.0
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN: '43551159299'
      SOURCE_SHA: '9719a5fdde6fb15f43e6a146def8d99c02a6b8c9'
      APK_SHA256: '6292e3aff42057f08701394da577b1af3d86686781190164b3aa7b79381c7d25'
      RELEASE_TAG: 'v0.7.0-demo'
      APK_NAME: 'GRBL-Tool-Mobile-0.7.0.apk'
    steps:
      - name: Verify source workflow succeeded at the audited commit
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" > source-run.json
          jq -e --arg sha "$SOURCE_SHA" '.head_sha == $sha and .status == "completed" and .conclusion == "success"' source-run.json
          # The release tag points to this publishing revision. Its app code must match the audited source.
          gh api "repos/$GH_REPO/compare/$SOURCE_SHA...$GITHUB_SHA" > release-diff.json
          jq -e 'all(.files[]; (.filename | startswith("docs/")) or .filename == "README.md" or .filename == ".github/workflows/distribute-demo.yml")' release-diff.json
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
          path: package
      - name: Verify and prepare original signed APK
        shell: bash
        run: |
          set -euo pipefail
          cd package
          sha256sum --check SHA256SUMS.txt
          test "$(find . -maxdepth 1 -name '*-Signed.apk' | wc -l)" -eq 1
          mv ./*-Signed.apk "$APK_NAME"
          printf '%s  %s\n' "$APK_SHA256" "$APK_NAME" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Publish immutable demo assets
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            mkdir existing
            gh release download "$RELEASE_TAG" --pattern "$APK_NAME" --dir existing
            printf '%s  %s\n' "$APK_SHA256" "existing/$APK_NAME" | sha256sum --check
            exit 0
          fi
          cat > release-notes.md <<'NOTES'
          已通过 120 项核心测试及 Android API 35 模拟器完整交互验收的 0.7.0 演示版。

          安装：Android 10 及以上，ARM64 / x86_64。下载 APK 后安装，在设备页点击“体验完整演示”。

          OpenCV 照片细节、图文保真和文档局部阈值；Clipper2 保留精细像素边界与孔洞。照片/密集二维码回归和实际 Android 导入生成已验证。
          设置集中一页；详情、选项及历史按实际空间排版；原生短动画、水波纹和后台历史加载。
          原始 USB 枚举、VID/PID/接口诊断、自定义兼容驱动映射，以及 DTR/RTS 保持/低/高配置。
          保留文件白名单、等比例尺寸上限、八套桌面抖动、暂停/继续、后台执行和任务历史。
          本轮验证使用模拟器与协议/USB 描述符模拟；实体控制板验收单独记录。

          原始已验收安装包，保留其签名与 SHA256；源码版本为 9719a5fdde6fb15f43e6a146def8d99c02a6b8c9。
          源码采用 GPL-3.0-or-later；源码和第三方声明包含在本标签对应的仓库中。
          NOTES
          gh release create "$RELEASE_TAG" "package/$APK_NAME" package/SHA256SUMS.txt --target "$GITHUB_SHA" --prerelease --title 'GRBL Tool Mobile 0.7.0 Demo' --notes-file release-notes.md
