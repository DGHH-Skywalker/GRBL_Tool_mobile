name: Distribute verified demo
on:
  push:
    branches: [main]
    paths: ['.github/workflows/distribute-demo.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: distribute-demo-0.7.1
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN: '43771416430'
      SOURCE_SHA: '85f47b01ebff4bf98dc30fbcb359e3aeb4bed533'
      APK_SHA256: '5efcdf246fded82f2b2bc977f31443f01fadf85491910b882cd7be72cca26620'
      RELEASE_TAG: 'v0.7.1-demo'
      APK_NAME: 'GRBL-Tool-Mobile-0.7.1.apk'
    steps:
      - name: Verify source workflow succeeded at the audited commit
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" > source-run.json
          jq -e --arg sha "$SOURCE_SHA" '.head_sha == $sha and .status == "completed" and .conclusion == "success"' source-run.json
          # The release tag points to this publishing revision. Its app code must match the audited source.
          gh api "repos/$GH_REPO/compare/$SOURCE_SHA...$GITHUB_SHA" > release-diff.json
          jq -e 'all(.files[]; (.filename | startswith("docs/")) or .filename == "README.md" or .filename == ".github/workflows/distribute-demo.yml")' release-diff.json
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
          path: package
      - name: Verify and prepare original signed APK
        shell: bash
        run: |
          set -euo pipefail
          cd package
          sha256sum --check SHA256SUMS.txt
          test "$(find . -maxdepth 1 -name '*-Signed.apk' | wc -l)" -eq 1
          mv ./*-Signed.apk "$APK_NAME"
          printf '%s  %s\n' "$APK_SHA256" "$APK_NAME" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Publish immutable demo assets
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            mkdir existing
            gh release download "$RELEASE_TAG" --pattern "$APK_NAME" --dir existing
            printf '%s  %s\n' "$APK_SHA256" "existing/$APK_NAME" | sha256sum --check
            exit 0
          fi
          cat > release-notes.md <<'NOTES'
          已通过 124 项核心测试及 Android API 35 模拟器完整交互验收的 0.7.1 演示版。

          安装：Android 10 及以上，ARM64 / x86_64。下载 APK 后安装，在设备页点击“体验完整演示”。

          位图从 Android 系统照片选择器导入，旧系统使用相册 ACTION_PICK；SVG、G-code 和配置继续使用文档接口。
          修复选项页重排重建按钮、异步按钮状态被定时刷新覆盖、遗留选择器与旧任务恢复干扰新操作等问题。
          增加导入取消/错误与导出成功反馈，导出固定点击时内容，保持生成取消入口。
          保留 OpenCV 照片与精细图文、USB 诊断及控制线配置、任务流控、后台执行和历史。
          验证使用模拟器与协议/USB 描述符模拟，厂商相册和实体控制板验收单独记录。

          原始已验收安装包，保留其签名与 SHA256；应用源码为 75ab08faf94ddf20ef116883e0cc49cbe852403e，UI 验证脚本修订为 85f47b01ebff4bf98dc30fbcb359e3aeb4bed533。
          源码采用 GPL-3.0-or-later；源码和第三方声明包含在本标签对应的仓库中。
          NOTES
          gh release create "$RELEASE_TAG" "package/$APK_NAME" package/SHA256SUMS.txt --target "$GITHUB_SHA" --prerelease --title 'GRBL Tool Mobile 0.7.1 Demo' --notes-file release-notes.md
