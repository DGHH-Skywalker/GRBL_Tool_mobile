name: Distribute verified demo
on:
  push:
    branches: [main]
    paths: ['.github/workflows/distribute-demo.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: distribute-demo-0.3.0
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN: '43389716471'
      SOURCE_SHA: '2029bb38b87b05fa051fca51717aaae074fd81f2'
      APK_SHA256: 'e80db22c46f7093867752ac2556ac081e0adb17a27f7d79f07a55d6bcae135e9'
      RELEASE_TAG: 'v0.3.0-demo'
      APK_NAME: 'GRBL-Tool-Mobile-0.3.0.apk'
    steps:
      - name: Verify source workflow succeeded at the audited commit
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" > source-run.json
          jq -e --arg sha "$SOURCE_SHA" '.head_sha == $sha and .status == "completed" and .conclusion == "success"' source-run.json
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
          path: package
      - name: Verify and prepare original signed APK
        shell: bash
        run: |
          set -euo pipefail
          cd package
          sha256sum --check SHA256SUMS.txt
          test "$(find . -maxdepth 1 -name '*-Signed.apk' | wc -l)" -eq 1
          mv ./*-Signed.apk "$APK_NAME"
          printf '%s  %s\n' "$APK_SHA256" "$APK_NAME" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Publish immutable demo assets
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            mkdir existing
            gh release download "$RELEASE_TAG" --pattern "$APK_NAME" --dir existing
            printf '%s  %s\n' "$APK_SHA256" "existing/$APK_NAME" | sha256sum --check
            exit 0
          fi
          cat > release-notes.md <<'NOTES'
          已通过 59 项核心测试及 Android API 35 模拟器完整交互验收的 0.3.0 演示版。

          安装：Android 10 及以上，ARM64 / x86_64。下载 APK 后安装，在设备页点击“体验完整演示”。

          包含 USB 控制、文件导入与预览、暂停/继续、后台完成、任务历史和内置演示。
          实体控制板与现场加工验收独立进行。

          原始已验收安装包，保留其签名与 SHA256；源码版本为 2029bb38b87b05fa051fca51717aaae074fd81f2。
          源码采用 GPL-3.0-or-later；源码和第三方声明包含在本标签对应的仓库中。
          NOTES
          gh release create "$RELEASE_TAG" "package/$APK_NAME" package/SHA256SUMS.txt --target "$SOURCE_SHA" --prerelease --title 'GRBL Tool Mobile 0.3.0 Demo' --notes-file release-notes.md
