name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  core:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet workload restore GRBL.Tool.Mobile.Core.slnx
      - run: dotnet restore GRBL.Tool.Mobile.Core.slnx --locked-mode
      - run: python3 tools/contour-fixtures/prepare.py
      - run: dotnet test GRBL.Tool.Mobile.Core.slnx -c Release --no-restore --logger trx --results-directory artifacts/tests
      - run: dotnet run --project tools/LaserMobile.GrblSimulator -c Release --no-restore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/tests
  opencv-native:
    timeout-minutes: 35
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: native
        with:
          path: artifacts/opencv-native/${{ matrix.abi }}
          key: opencv-4.13-16k-v1-${{ matrix.abi }}-${{ hashFiles('tools/native-opencv/**') }}
      - uses: android-actions/setup-android@v3
        if: steps.native.outputs.cache-hit != 'true'
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Build pinned OpenCV native runtime with 16 KB alignment
        if: steps.native.outputs.cache-hit != 'true'
        run: |
          sdkmanager "ndk;28.2.13676358"
          bash tools/native-opencv/build.sh "${{ matrix.abi }}" "$ANDROID_HOME/ndk/28.2.13676358"
      - run: python3 tools/native-opencv/verify.py "artifacts/opencv-native/${{ matrix.abi }}/libOpenCvSharpExtern.so" "${{ matrix.abi }}"
      - uses: actions/upload-artifact@v4
        with:
          name: opencv-native-${{ matrix.abi }}
          path: artifacts/opencv-native
  android:
    needs: [opencv-native]
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: dotnet workload restore GRBL.Tool.Mobile.slnx
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - run: dotnet restore GRBL.Tool.Mobile.slnx --locked-mode
      - uses: actions/cache@v4
        with:
          path: ~/.cache/grbl-demo-signing
          key: grbl-demo-signing-v1
      - name: Prepare demo signing identity
        shell: bash
        run: |
          set -euo pipefail
          signing_dir="$HOME/.cache/grbl-demo-signing"
          mkdir -p "$signing_dir"
          if [ ! -f "$signing_dir/demo.keystore" ]; then
            openssl rand -hex 24 > "$signing_dir/password"
            export GRBL_DEMO_SIGNING_PASSWORD="$(cat "$signing_dir/password")"
            keytool -genkeypair -keystore "$signing_dir/demo.keystore" -alias grbl-demo -keyalg RSA -keysize 3072 -validity 3650 -dname "CN=GRBL Tool Mobile Demo" -storepass:env GRBL_DEMO_SIGNING_PASSWORD -keypass:env GRBL_DEMO_SIGNING_PASSWORD
          fi
          signing_password="$(cat "$signing_dir/password")"
          echo "::add-mask::$signing_password"
          echo "GRBL_DEMO_SIGNING_PASSWORD=$signing_password" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          pattern: opencv-native-*
          path: artifacts/opencv-native
          merge-multiple: true
      - name: Build signed Release APK
        run: dotnet build src/LaserMobile.Android -c Release --no-restore -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" -p:AndroidKeyStore=true -p:AndroidSigningKeyStore="$HOME/.cache/grbl-demo-signing/demo.keystore" -p:AndroidSigningKeyAlias=grbl-demo -p:AndroidSigningStorePass=env:GRBL_DEMO_SIGNING_PASSWORD -p:AndroidSigningKeyPass=env:GRBL_DEMO_SIGNING_PASSWORD
      - name: Verify APK and write checksums
        shell: bash
        run: |
          mkdir -p artifacts/apk
          find src/LaserMobile.Android/bin/Release -name '*-Signed.apk' -exec cp {} artifacts/apk/ \;
          test -n "$(find artifacts/apk -name '*.apk' -print -quit)"
          for apk in artifacts/apk/*.apk; do python3 tools/native-opencv/verify.py "$apk"; done
          for apk in artifacts/apk/*.apk; do "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"; done
          cd artifacts/apk
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: artifacts/apk
          retention-days: 30
  demo-smoke:
    needs: [core, android]
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts/apk
      - uses: actions/download-artifact@v4
        with:
          name: test-results
          path: artifacts/core
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 3072
          script: python3 tools/android-smoke/smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-smoke-evidence
          path: artifacts/demo-smoke
          retention-days: 30
